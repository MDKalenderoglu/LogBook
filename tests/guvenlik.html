/* Asgari geçerli PDF (tek boş sayfa) — çapraz başvuru tablosu doğru ofsetlerle kurulur */
function asgariPdf(){
  const nes=["<< /Type /Catalog /Pages 2 0 R >>","<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
    "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 200 200] >>"];
  let s="%PDF-1.4\n"; const ofs=[];
  nes.forEach((o,i)=>{ ofs.push(s.length); s+=`${i+1} 0 obj\n${o}\nendobj\n`; });
  const xref=s.length;
  s+=`xref\n0 ${nes.length+1}\n0000000000 65535 f \n`+ofs.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("");
  s+=`trailer\n<< /Size ${nes.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return new TextEncoder().encode(s);
}

// Temizlenmiş HTML'i ETKİSİZ bir şablonda inceler: izinsiz etiket / öznitelik / bağlantı var mı?
function ciktiDenetle(html){
  const t=document.createElement("template"); t.innerHTML=html;
  const izin=new Set(["B","STRONG","I","EM","U","S","STRIKE","MARK","BR","DIV","P","SPAN","UL","OL","LI","BLOCKQUOTE","H1","H2","H3","A"]);
  const sorun=[];
  t.content.querySelectorAll("*").forEach(el=>{
    if(!izin.has(el.tagName.toUpperCase())) sorun.push("etiket:"+el.tagName);
    for(const a of el.attributes){
      const ad=a.name.toLowerCase();
      if(ad==="href"){ if(!/^(https?:|mailto:)/i.test(a.value)) sorun.push("href:"+a.value.slice(0,30)); }
      else if(ad==="class"){ if(a.value!=="pdate") sorun.push("class:"+a.value); }
      else if(!(el.tagName==="A"&&(ad==="target"||ad==="rel"))) sorun.push("öznitelik:"+ad);
    }
  });
  return sorun;
}

test("Güvenlik politikası (CSP)","CSP özeti uygulama koduyla eşleşiyor",async()=>{
  const m=KAYNAK.match(/'sha256-([A-Za-z0-9+/=]+)'/), k=KAYNAK.match(/<script>([\s\S]*?)<\/script>/);
  if(!m) return ["CSP özeti yok"]; if(!k) return ["satır içi kod bulunamadı"];
  const oz=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(k[1])))));
  return oz===m[1]?true:["Özet uyuşmuyor — tools/csp-hash.py çalıştırılmalı"];
});

});

/* ---------- Çalıştırıcı ---------- */
async function calistir(){
  $("#basla").disabled=true; $("#sonuc").innerHTML=""; $("#ozet").textContent="Hazırlanıyor…";
  if(!ESKI){ try{ localStorage.removeItem("nbmd_guvenlik_testi"); indexedDB.deleteDatabase("nbmd-guvenlik-testi"); }catch(e){} }
  KAYNAK=await (await fetch(HEDEF,{cache:"no-store"})).text();
  const fr=$("#uyg");
  await new Promise(r=>{ fr.onload=r; fr.src=HEDEF+(HEDEF.includes("?")?"&":"?")+"guvenlik-testi"; });
  W=fr.contentWindow; await bekle(500);
  // Güvenlik kilidi: test modu yoksa (eski sürüm/önbellek) gerçek veriye dokunmamak için dur
  const testModu=!!(W.__test&&W.__test.TEST_MODU);
  if(!testModu&&!ESKI){ $("#ozet").textContent="Durduruldu: uygulama test modunda açılmadı (eski sürüm önbellekte olabilir). Sayfayı yenileyip tekrar dene."; $("#basla").disabled=false; return; }
  W.confirm=()=>true; W.alert=()=>{}; W.prompt=()=>null;
  ihlaller=[]; W.document.addEventListener("securitypolicyviolation",e=>ihlaller.push(e.violatedDirective+" "+(e.blockedURI||"satır içi")));
  let gecti=0,kaldi=0,atlandi=0,sonGrup="";
  for(const t of T){
    if(t.grupAdi!==sonGrup){ grup(t.grupAdi); sonGrup=t.grupAdi; }
    $("#ozet").textContent="Çalışıyor: "+t.ad;
    try{
      const r=await t.fn();
      if(r===true){ satir("gecti",t.ad); gecti++; } else { satir("kaldi",t.ad,(r||[]).join(" · ")); kaldi++; }
    }catch(e){
      if(e instanceof Atla){ satir("atlandi",t.ad,e.message); atlandi++; }
      else{ satir("kaldi",t.ad,"Hata: "+e.message); kaldi++; }
    }
  }
  $("#ozet").innerHTML="";
  $("#ozet").textContent=`${gecti} geçti · ${kaldi} kaldı · ${atlandi} atlandı`;
  $("#ozet").className=kaldi?"kaldi":"gecti";
  if(!ESKI){ try{ localStorage.removeItem("nbmd_guvenlik_testi"); indexedDB.deleteDatabase("nbmd-guvenlik-testi"); }catch(e){} }
  $("#basla").disabled=false;
}
$("#basla").onclick=calistir;
if(prm.has("otomatik")) calistir();
</script>
